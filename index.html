<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Kyron Apply</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:#161b22;
    width:90%;
    max-width:450px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,191,255,.3);
}

h1{
    color:#00bfff;
    text-align:center;
    margin-bottom:10px;
}

p{
    color:#bdbdbd;
    text-align:center;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00bfff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0099cc;
}
</style>
</head>

<body>

<div class="container">

<h1>Team Kyron</h1>
<p>Apply to Join Our Team</p>

<form>

<input type="text" placeholder="Minecraft Username" required>

<input type="text" placeholder="Discord Username" required>

<input type="number" placeholder="Age" required>

<select required>
<option value="">Select Section</option>
<option>PvPer</option>
<option>Grinder</option>
</select>

<button type="submit">Submit Application</button>

</form>

</div>

</body>
</html>

<div id="formBox">
<form onsubmit="submitForm(event)">

<input type="text" placeholder="Minecraft Username" required>

<input type="text" placeholder="Discord Username" required>

<input type="number" placeholder="Age" required>

<select required>
<option value="">Select Section</option>
<option>PvPer</option>
<option>Grinder</option>
</select>

<button type="submit">Submit Application</button>

</form>
</div>

<div id="successBox" style="display:none;text-align:center;color:white;">
<h2 style="color:#00ff88;">✅ Application Submitted!</h2>
<p>Your application has been submitted successfully.</p>

<a href="https://discord.gg/YOURINVITELINK" target="_blank">
<button style="margin-top:15px;padding:12px 25px;background:#5865F2;color:white;border:none;border-radius:8px;cursor:pointer;">
Join Team Kyron Discord
</button>
</a>
</div>

<script>
function submitForm(e){
e.preventDefault();
document.getElementById("formBox").style.display="none";
document.getElementById("successBox").style.display="block";
}
</script>
